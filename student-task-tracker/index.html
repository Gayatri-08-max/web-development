<!DOCTYPE html>
<html>
<head>
    <title>Student Task Tracker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Task Tracker</h1>

    <p id="score">🏆 Productivity Score: 0 points</p>

    <p id="summary"></p>

    <button id="sound-toggle">🔔 Sound: On</button>

    <form>
        <label for="task">Task</label>
        <input type="text" id="task" placeholder="Enter a task" maxlength="60">

        <label for="time">Estimated Time (minutes)</label>
        <input type="number" id="time" placeholder="e.g. 30">

        <p id="form-error"></p>

        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    <div id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div id="taskList"></div>
    <script src="script.js"></script>

</body>
</html>
